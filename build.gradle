// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.dagger.hilt.android) apply false
    alias(libs.plugins.dokka) apply false
    alias(libs.plugins.dokka.javadoc) apply false
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.kotlin.parcelize) apply false
    alias(libs.plugins.ksp) apply false
    alias(libs.plugins.maven.publish)
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

def localProperties = new Properties().tap {
    if (file("local.properties").exists()) {
        it.load(file("local.properties").newInputStream())
    }
}

subprojects {
    apply plugin: "maven-publish"
    apply plugin: "org.jetbrains.dokka"
    apply plugin: "org.jetbrains.dokka-javadoc"

    afterEvaluate {
        if (!it.plugins.hasPlugin("com.android.library")) return

        dokka {
            dokkaSourceSets {
                configureEach {
                    if (name == "debug") suppress = true
                }
            }
        }

        tasks.register('androidSourcesJar', Jar) {
            getArchiveClassifier().set('sources')
            from android.sourceSets.main.java.source
        }

        tasks.register('dokkaJavadocJar', Jar) {
            dependsOn dokkaGeneratePublicationJavadoc
            getArchiveClassifier().set('javadoc')
            from dokkaGeneratePublicationJavadoc.outputDirectory
        }
        tasks.register('dokkaHtmlJar', Jar) {
            dependsOn dokkaGeneratePublicationHtml
            getArchiveClassifier().set('html-doc')
            from dokkaGeneratePublicationHtml.outputDirectory
        }

        artifacts {
            archives androidSourcesJar
            archives dokkaJavadocJar
            archives dokkaHtmlJar
        }

        publishing {
            repositories {
                maven {
                    name = "GitHubPackages"
                    url = uri("https://maven.pkg.github.com/PnX-SI/gn_mobile_core")
                    credentials {
                        username = localProperties.get("gpr.user") ?: System.getenv("USERNAME")
                        password = localProperties.get("gpr.key") ?: System.getenv("TOKEN")
                    }
                }
            }
            publications {
                gpr(MavenPublication) {
                    afterEvaluate {
                        from components.release
                    }
                    artifact androidSourcesJar
                    artifact dokkaJavadocJar
                    artifact dokkaHtmlJar
                    groupId = 'fr.geonature'
                    artifactId = project.name
                    version = project.findProperty('version') ?: '0.0.1'

                    pom {
                        name = 'GeoNature Android core libraries'
                        description = 'Some libraries for GeoNature Android applications'
                        url = 'https://github.com/PnX-SI/gn_mobile_core'

                        licenses {
                            license {
                                name = 'GNU General Public License version 3.0'
                                url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
                            }
                        }

                        developers {
                            developer {
                                id = 'sgrimault'
                                name = 'Sebastien GRIMAULT'
                                email = 'sebastien.grimault@gmail.com'
                            }
                        }
                    }
                }
            }
        }
    }
}
